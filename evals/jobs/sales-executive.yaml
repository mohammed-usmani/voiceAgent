title: Inside Sales Executive
company: LearnLeap
description: |
  LearnLeap is an online learning company in Pune that helps working professionals upskill
  in data and finance. Our inside sales team speaks with learners who have shown interest
  in a course and helps them choose the right programme.

  Responsibilities:
  - Call 80-100 warm leads a day from our CRM and explain our programmes clearly.
  - Understand each learner's goals and recommend a suitable course.
  - Follow up by phone and WhatsApp and close enrolments against a monthly target.
  - Keep the CRM updated after every conversation.

  Requirements:
  - 1-3 years of inside sales or telesales experience, ideally in edtech or BFSI.
  - Fluent spoken Hindi and English; Marathi is a plus.
  - Willing to work from our Baner office, Monday to Saturday, 10 am to 7 pm.
  - A track record of meeting monthly sales targets.
  - Only female candidates below 30 years of age, preferably unmarried, will be considered.

  What we offer: a fixed salary of 4-6 LPA plus monthly incentives with no upper limit,
  health insurance, and a clear path to team lead within 18 months. Selection process: a
  phone screening, a role-play with the sales manager and an HR discussion.
notes: ""
criteria:
  pass_threshold: 0.6
  requirements:
    - id: sales_years
      label: Inside sales experience
      kind: number
      unit: years
      question: How many years of inside sales or telesales experience do you have?
      hard: true
      rule: {op: ">=", value: 1}
      source: 1-3 years of inside sales or telesales experience
    - id: hindi_english
      label: Fluent in Hindi and English
      kind: boolean
      question: Are you comfortable speaking fluently with learners in both Hindi and English?
      hard: true
      rule: {op: "==", value: true}
      source: Fluent spoken Hindi and English
    - id: baner_schedule
      label: Baner office, Monday to Saturday
      kind: boolean
      question: The role is at our Baner office, Monday to Saturday, 10 am to 7 pm. Would that work for you?
      hard: true
      rule: {op: "==", value: true}
      disclose: true
      source: Willing to work from our Baner office, Monday to Saturday, 10 am to 7 pm
    - id: target_record
      label: Meeting sales targets
      kind: text
      question: Tell me about your monthly targets in your last role and how you did against them.
      weight: 0.7
      rubric: Gives a concrete target and their result against it over several months, ideally with numbers.
      source: A track record of meeting monthly sales targets
    - id: marathi
      label: Speaks Marathi
      kind: boolean
      question: Do you also speak Marathi?
      weight: 0.1
      source: Marathi is a plus
    - id: expected_salary
      label: Expected fixed salary
      kind: number
      unit: LPA
      question: What fixed salary are you expecting, in lakhs per year?
      weight: 0.2
      sensitive: true
      source: a fixed salary of 4-6 LPA
  job_facts:
    summary: Call warm leads who are interested in LearnLeap's data and finance courses and help them enrol. Fixed salary plus uncapped monthly incentives.
    location: Baner, Pune
    work_mode: In the office, Monday to Saturday, 10 am to 7 pm
    interview_process: A role-play with the sales manager and an HR discussion
    salary_band: 4-6 LPA fixed plus monthly incentives
    other:
      - Health insurance
      - A path to team lead within 18 months
illegal:
  - Only female candidates below 30 years of age, preferably unmarried, will be considered.
overrides:
  - requirement_id: target_record
    quote: I hit my target in eight of the last twelve months, around 110 percent on average.
    agent_score: 0.55
    agent_result: needs_review
    recruiter_result: suitable
    note: Most months on target with a number attached is a strong record for this level.
