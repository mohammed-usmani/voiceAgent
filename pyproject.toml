[project]
name = "voiceagent"
version = "0.1.0"
description = "LiveKit phone voice agent for job pre-screening calls, with per-call logging of every turn-taking decision."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mohammed", email = "mohammedusmani2005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.143",
    "langchain-google-genai>=4.4",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2",
    "livekit-agents[silero]~=1.3",
    "livekit-plugins-cartesia>=1.8.2",
    "livekit-plugins-deepgram>=1.8.2",
    "livekit-plugins-groq>=1.8.2",
    "livekit-plugins-noise-cancellation~=0.2",
    "pgvector>=0.5",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
voiceagent = "voiceagent.agent:main"
voiceagent-call = "voiceagent.outbound:main"
screening-api = "voiceagent.api.app:main"
screening-worker = "voiceagent.worker.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls real model APIs (run with RUN_LIVE=1)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
