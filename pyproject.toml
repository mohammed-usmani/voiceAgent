[project]
name = "voiceagent"
version = "0.1.0"
description = "LiveKit voice agent that uses Jev to decide when the caller has actually finished speaking."
readme = "README.md"
authors = [
    { name = "Mohammed", email = "mohammedusmani2005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "livekit-agents[silero]~=1.3",
    "livekit-plugins-cartesia>=1.8.2",
    "livekit-plugins-deepgram>=1.8.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
voiceagent = "voiceagent:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
